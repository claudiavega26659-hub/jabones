<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administración · Jabones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="admin"><p class="cargando">Cargando…</p></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<div id="velo" class="velo" hidden>Guardando en GitHub…</div>

<script src="comun.js"></script>
<script>
/* ======================= Conexión con GitHub ======================= */
const ESTADOS = {pendiente:['Pendiente','e-warn'], pagada:['Pagada','e-ok'], entregada:['Entregada','e-ok'], cancelada:['Cancelada','e-bad']};
const PAGOS = ['Efectivo','Transferencia','Tarjeta','Otro'];
const UNIDADES = {g:['g',1,'g'], kg:['kg',1000,'g'], ml:['ml',1,'ml'], L:['L',1000,'ml'], oz:['oz',28.35,'g'], u:['unidad',1,'u']};
const VACIO_DATOS = () => ({ventas:[], produccion:[], compras:[]});

let CFG = leerLocal('jab_github', null);
let D = {config:{nombre:'Jabones Artesanales', slogan:'', whatsapp:'', moneda:'$', intro:'Hola, quiero hacer este pedido:'}, productos:[]}, catSha = null;
let DATOS = VACIO_DATOS(), datSha = null, ultimaSinc = null;
let tab = leerLocal('jab_tab', 'resumen'), mesSel = hoy().slice(0, 7);

function aB64(txt) {
  const b = new TextEncoder().encode(txt); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function deB64(b64) {
  const s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
async function gh(ruta, opts = {}, cfg = CFG) {
  const r = await fetch('https://api.github.com' + ruta, {...opts, headers:{
    Accept:'application/vnd.github+json', Authorization:'Bearer ' + cfg.token, 'X-GitHub-Api-Version':'2022-11-28', ...(opts.headers || {})}});
  if (!r.ok) {
    const e = new Error('GitHub ' + r.status); e.status = r.status;
    try { e.detalle = (await r.json()).message; } catch {}
    throw e;
  }
  return r.status === 204 ? null : r.json();
}
const rutaArchivo = (repo, ruta, cfg = CFG) => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(repo)}/contents/${ruta.split('/').map(encodeURIComponent).join('/')}`;
async function leerArchivo(repo, ruta) {
  try {
    const r = await gh(rutaArchivo(repo, ruta) + '?ref=' + encodeURIComponent(CFG.rama));
    let txt;
    if (r.encoding === 'base64') txt = deB64(r.content || '');
    else { // archivos de más de 1 MB llegan sin contenido: se piden en crudo
      const raw = await fetch('https://api.github.com' + rutaArchivo(repo, ruta) + '?ref=' + encodeURIComponent(CFG.rama),
        {headers:{Accept:'application/vnd.github.raw+json', Authorization:'Bearer ' + CFG.token}});
      txt = await raw.text();
    }
    return {txt, sha:r.sha};
  } catch (e) { if (e.status === 404) return {txt:null, sha:null}; throw e; }
}
async function escribirArchivo(repo, ruta, contenidoB64, sha, mensaje) {
  const r = await gh(rutaArchivo(repo, ruta), {method:'PUT', body:JSON.stringify({message:mensaje, content:contenidoB64, branch:CFG.rama, ...(sha ? {sha} : {})})});
  return r.content.sha;
}
async function borrarArchivo(repo, ruta, mensaje) {
  try {
    const r = await gh(rutaArchivo(repo, ruta) + '?ref=' + encodeURIComponent(CFG.rama));
    await gh(rutaArchivo(repo, ruta), {method:'DELETE', body:JSON.stringify({message:mensaje, sha:r.sha, branch:CFG.rama})});
  } catch {}
}
function errorGitHub(e) {
  if (!navigator.onLine) return 'No hay conexión a internet.';
  if (e.status === 401) return 'La clave de GitHub no es válida o ya venció. Crea una nueva en Ajustes.';
  if (e.status === 403) return 'La clave no tiene permiso para escribir en el repositorio (o GitHub limitó las solicitudes). Revisa los permisos de la clave.';
  if (e.status === 404) return 'No se encontró el repositorio. Revisa el usuario y los nombres en Ajustes, y que la clave tenga acceso a ambos.';
  if (e.status === 409) return 'Los datos cambiaron desde otro dispositivo. Toca Actualizar y repite el cambio.';
  return 'GitHub respondió con un error' + (e.detalle ? ': ' + e.detalle : '.') ;
}
const linkTienda = () => CFG ? (CFG.pub.toLowerCase() === CFG.owner.toLowerCase() + '.github.io'
  ? `https://${CFG.pub.toLowerCase()}/` : `https://${CFG.owner.toLowerCase()}.github.io/${CFG.pub}/`) : '';
function fotoSrc(p) {
  if (p._preview) return p._preview;
  if (!p.foto) return '';
  if (/^(data:|https?:)/.test(p.foto)) return p.foto;
  return `https://raw.githubusercontent.com/${CFG.owner}/${CFG.pub}/${CFG.rama}/${p.foto}`;
}

async function cargarTodo() {
  $('#admin').innerHTML = '<p class="cargando">Cargando datos desde GitHub…</p>';
  try {
    const [cat, dat] = await Promise.all([leerArchivo(CFG.pub, 'catalogo.json'), leerArchivo(CFG.priv, 'datos.json')]);
    if (cat.txt) D = JSON.parse(cat.txt);
    catSha = cat.sha;
    DATOS = dat.txt ? {...VACIO_DATOS(), ...JSON.parse(dat.txt)} : VACIO_DATOS();
    datSha = dat.sha;
    MONEDA = D.config.moneda || '$';
    ultimaSinc = new Date();
    renderAdmin();
  } catch (e) {
    $('#admin').innerHTML = `<div class="wrap"><div class="vacio" style="margin-top:40px"><h3>No se pudieron cargar los datos</h3><p>${esc(errorGitHub(e))}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" id="reint">Reintentar</button><button class="btn" id="a-cfg">Revisar ajustes de GitHub</button></div></div></div>`;
    $('#reint').onclick = cargarTodo;
    $('#a-cfg').onclick = () => pantallaConexion();
  }
}
/* Guarda el catálogo público (catalogo.json en el repositorio público) */
async function guardarCatalogo(nuevo, mensaje) {
  $('#velo').hidden = false;
  try {
    const limpio = structuredClone(nuevo); limpio.productos.forEach(p => delete p._preview);
    catSha = await escribirArchivo(CFG.pub, 'catalogo.json', aB64(JSON.stringify(limpio, null, 2) + '\n'), catSha, mensaje);
    D = limpio; MONEDA = D.config.moneda || '$';
    toast('Guardado. La página pública se actualiza en 1 o 2 minutos.');
    renderAdmin(); return true;
  } catch (e) { toast(errorGitHub(e)); return false; }
  finally { $('#velo').hidden = true; }
}
/* Cambia los datos privados (datos.json). Si otro dispositivo guardó antes, recarga y aplica el cambio otra vez. */
async function cambiarDatos(fn, mensaje) {
  $('#velo').hidden = false;
  try {
    for (let intento = 0; intento < 2; intento++) {
      if (intento) { const d = await leerArchivo(CFG.priv, 'datos.json'); DATOS = d.txt ? {...VACIO_DATOS(), ...JSON.parse(d.txt)} : VACIO_DATOS(); datSha = d.sha; }
      const copia = structuredClone(DATOS); fn(copia);
      try {
        datSha = await escribirArchivo(CFG.priv, 'datos.json', aB64(JSON.stringify(copia) + '\n'), datSha, mensaje);
        DATOS = copia; ultimaSinc = new Date(); renderSeccion(); return true;
      } catch (e) { if ((e.status === 409 || e.status === 422) && !intento) continue; throw e; }
    }
  } catch (e) { toast(errorGitHub(e)); return false; }
  finally { $('#velo').hidden = true; }
}
const guardarReg = (col, obj, msg) => cambiarDatos(d => { const i = d[col].findIndex(x => x.id === obj.id); if (i >= 0) d[col][i] = obj; else d[col].push(obj); }, msg);
const borrarReg = (col, id, msg) => cambiarDatos(d => { d[col] = d[col].filter(x => x.id !== id); }, msg).then(ok => ok && toast('Registro eliminado'));

/* ======================= Pantalla de conexión ======================= */
function pantallaConexion() {
  const c = CFG || {owner:'', pub:'jabones', priv:'jabones-datos', rama:'main', token:''};
  $('#admin').innerHTML = `<main class="wrap seccion" style="max-width:680px">
    <div class="sec-cab"><h2>Conectar con GitHub</h2>${CFG ? '<button class="btn" id="c-volver">Volver</button>' : ''}</div>
    <p class="muted" style="margin:0">El catálogo se guarda en tu repositorio público y las ventas, compras y producción en tu repositorio privado. Esta información se guarda solo en este navegador.</p>
    <form class="panel" id="f-con" style="display:flex;flex-direction:column;gap:14px">
      <label class="campo"><span>Usuario de GitHub</span><input id="c-owner" required autocomplete="username" value="${esc(c.owner)}" placeholder="mi-usuario"></label>
      <div class="fila">
        <label class="campo"><span>Repositorio público (la página)</span><input id="c-pub" required value="${esc(c.pub)}"></label>
        <label class="campo"><span>Repositorio privado (los datos)</span><input id="c-priv" required value="${esc(c.priv)}"></label>
        <label class="campo"><span>Rama</span><input id="c-rama" required value="${esc(c.rama)}"></label></div>
      <label class="campo"><span>Clave de acceso (token)</span><input id="c-token" type="password" required autocomplete="off" value="${esc(c.token)}" placeholder="github_pat_…">
        <span class="ayuda">Un token "fine-grained" con acceso solo a esos dos repositorios y permiso <b>Contents: Read and write</b>. No lo compartas con nadie.</span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri">Probar y guardar</button>
        ${CFG ? '<button type="button" class="btn peligro" id="c-salir">Desconectar este dispositivo</button>' : ''}</div>
      <p class="ayuda" id="c-msg" aria-live="polite"></p>
    </form>
    <details class="panel"><summary style="cursor:pointer;font-weight:600">Cómo crear la clave de acceso</summary>
      <ol class="pasos" style="margin-top:10px">
        <li>En GitHub, entra a tu foto → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>
        <li>Ponle un nombre (por ejemplo "Panel de jabones") y elige la fecha de vencimiento más lejana que te permita.</li>
        <li>En <b>Repository access</b> elige <b>Only select repositories</b> y marca los dos repositorios.</li>
        <li>En <b>Permissions → Repository permissions</b>, busca <b>Contents</b> y elige <b>Read and write</b>.</li>
        <li>Toca <b>Generate token</b>, cópialo y pégalo aquí. GitHub solo lo muestra una vez.</li>
      </ol></details></main>`;
  const v = $('#c-volver'); if (v) v.onclick = renderAdmin;
  const s = $('#c-salir'); if (s) s.onclick = () => { borrarLocal('jab_github'); CFG = null; pantallaConexion(); };
  $('#f-con').onsubmit = async e => {
    e.preventDefault();
    const nuevo = {owner:$('#c-owner').value.trim(), pub:$('#c-pub').value.trim(), priv:$('#c-priv').value.trim(), rama:$('#c-rama').value.trim() || 'main', token:$('#c-token').value.trim()};
    const msg = $('#c-msg'); msg.textContent = 'Probando la conexión…';
    try {
      for (const repo of [nuevo.pub, nuevo.priv]) {
        const r = await gh(`/repos/${encodeURIComponent(nuevo.owner)}/${encodeURIComponent(repo)}`, {}, nuevo);
        if (repo === nuevo.priv && !r.private) { msg.textContent = `El repositorio ${repo} es público: cualquiera vería tus ventas. Cámbialo a privado en GitHub (Settings → General → Danger Zone → Change visibility).`; return; }
        if (r.permissions && !r.permissions.push) { msg.textContent = `La clave no puede escribir en ${repo}. Dale permiso Contents: Read and write.`; return; }
      }
      CFG = nuevo; guardarLocal('jab_github', CFG); cargarTodo();
    } catch (err) { msg.textContent = errorGitHub(err); }
  };
}

/* ======================= Cálculos ======================= */
const prod = id => D.productos.find(p => p.id === id);
function stockProductos() {
  const m = {};
  D.productos.forEach(p => m[p.id] = {hecho:0, vendido:0});
  DATOS.produccion.forEach(r => { (m[r.pid] ||= {hecho:0, vendido:0}).hecho += +r.cantidad || 0; });
  DATOS.ventas.filter(v => v.estado !== 'cancelada').forEach(v => (v.items || []).forEach(i => { (m[i.pid] ||= {hecho:0, vendido:0}).vendido += +i.cant || 0; }));
  Object.values(m).forEach(x => x.stock = x.hecho - x.vendido);
  return m;
}
const unidad = u => UNIDADES[u] || UNIDADES.u;
const claveInsumo = (n, u) => (n || '').trim().toLowerCase() + '|' + unidad(u)[2];
function insumos() {
  const m = {};
  const ent = (n, u) => m[claveInsumo(n, u)] ||= {nombre:(n || '').trim(), base:unidad(u)[2], comprado:0, usado:0, costo:0};
  DATOS.compras.forEach(c => (c.items || []).forEach(i => { if (!i.insumo) return; const e = ent(i.insumo, i.unidad); e.comprado += (+i.cant || 0) * unidad(i.unidad)[1]; e.costo += +i.costo || 0; }));
  DATOS.produccion.forEach(r => (r.insumos || []).forEach(i => { if (!i.insumo) return; ent(i.insumo, i.unidad).usado += (+i.cant || 0) * unidad(i.unidad)[1]; }));
  Object.values(m).forEach(e => { e.disp = e.comprado - e.usado; e.cpu = e.comprado ? e.costo / e.comprado : 0; });
  return Object.values(m).sort((a, b) => a.nombre.localeCompare(b.nombre));
}
const fmtCant = (n, base) => (Math.round(n * 100) / 100).toLocaleString('es') + ' ' + base;

/* ======================= Interfaz ======================= */
function renderAdmin() {
  if (!CFG) return pantallaConexion();
  const tabs = {resumen:'Resumen', catalogo:'Catálogo', ventas:'Ventas', produccion:'Producción', compras:'Compras', ajustes:'Ajustes'};
  $('#admin').innerHTML = `<div class="adm-top"><div class="wrap">
      <h1><span class="etq">Administración</span>${esc(D.config.nombre)}</h1>
      <span class="sinc" id="sinc"></span>
      <button class="btn chico" id="a-act">Actualizar</button>
      <a class="btn chico" href="index.html" target="_blank" rel="noopener">Ver catálogo</a></div>
      <div class="wrap"><nav class="pestanas" role="tablist">${Object.entries(tabs).map(([k, v]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${v}</button>`).join('')}</nav></div></div>
    <main class="wrap seccion" id="sec"></main>`;
  $('#a-act').onclick = cargarTodo;
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; guardarLocal('jab_tab', tab); renderAdmin(); });
  renderSeccion();
}
function renderSeccion() {
  const s = $('#sec'); if (!s) return;
  const si = $('#sinc'); if (si && ultimaSinc) si.textContent = 'Sincronizado ' + ultimaSinc.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
  ({resumen:secResumen, catalogo:secCatalogo, ventas:secVentas, produccion:secProduccion, compras:secCompras, ajustes:secAjustes})[tab](s);
}
function confirmar(titulo, texto, boton, fn) {
  abrir(`<div class="dlg"><div class="dlg-cab"><h2>${esc(titulo)}</h2><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo"><p style="margin:0">${esc(texto)}</p></div>
    <div class="dlg-pie"><button class="btn" data-cerrar>Cancelar</button><button class="btn peligro" id="conf-si">${esc(boton)}</button></div></div>`,
    d => $('#conf-si', d).onclick = () => { d.close(); fn(); });
}
const opcProductos = sel => `<option value="">Elige un jabón</option>` + D.productos.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
const opcUnidades = sel => Object.entries(UNIDADES).map(([k, v]) => `<option value="${k}" ${k === (sel || 'g') ? 'selected' : ''}>${v[0]}</option>`).join('');
const datalistInsumos = () => `<datalist id="dl-ins">${insumos().map(e => `<option value="${esc(e.nombre)}">`).join('')}</datalist>`;
const recientes = l => [...l].sort((a, b) => (b.fecha + b.creado).localeCompare(a.fecha + a.creado));

/* ---- Resumen ---- */
function secResumen(s) {
  const enMes = f => (f || '').startsWith(mesSel);
  const vMes = DATOS.ventas.filter(v => enMes(v.fecha) && v.estado !== 'cancelada');
  const vendido = vMes.reduce((t, v) => t + (+v.total || 0), 0);
  const porCobrar = DATOS.ventas.filter(v => v.estado === 'pendiente').reduce((t, v) => t + (+v.total || 0), 0);
  const gastado = DATOS.compras.filter(c => enMes(c.fecha)).reduce((t, c) => t + (+c.total || 0), 0);
  const hechos = DATOS.produccion.filter(r => enMes(r.fecha)).reduce((t, r) => t + (+r.cantidad || 0), 0);
  const uVend = vMes.reduce((t, v) => t + (v.items || []).reduce((a, i) => a + (+i.cant || 0), 0), 0);
  const st = stockProductos();
  const top = {}; vMes.forEach(v => (v.items || []).forEach(i => top[i.pid] = (top[i.pid] || 0) + (+i.cant || 0)));
  const topL = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5), maxT = Math.max(1, ...topL.map(x => x[1]));
  const ins = insumos();
  const nombreMes = new Date(mesSel + '-15').toLocaleDateString('es', {month:'long', year:'numeric'});
  s.innerHTML = `<div class="sec-cab"><h2>Resumen de ${esc(nombreMes)}</h2>
      <label class="filtro-mes"><span class="muted small">Mes</span><input type="month" class="inp" id="mes" value="${mesSel}" style="width:auto"></label></div>
    <div class="kpis">
      <div class="kpi"><span>Vendido</span><b>${din(vendido)}</b><small>${vMes.length} ventas · ${uVend} jabones</small></div>
      <div class="kpi"><span>Compras</span><b>${din(gastado)}</b><small>insumos del mes</small></div>
      <div class="kpi"><span>Ganancia</span><b style="color:${vendido - gastado < 0 ? 'var(--bad)' : 'var(--ok)'}">${din(vendido - gastado)}</b><small>vendido − compras</small></div>
      <div class="kpi"><span>Elaborados</span><b class="num">${hechos}</b><small>jabones producidos</small></div>
      <div class="kpi"><span>Por cobrar</span><b>${din(porCobrar)}</b><small>ventas pendientes (todas)</small></div>
    </div>
    <div class="dos">
      <section class="panel"><h3>Existencias de jabones</h3>
        ${D.productos.length ? `<div class="tabla-wrap"><table><thead><tr><th>Jabón</th><th class="n">Hechos</th><th class="n">Vendidos</th><th class="n">Quedan</th><th></th></tr></thead><tbody>
        ${D.productos.map(p => { const x = st[p.id]; const e = x.stock <= 0 ? ['Sin stock', 'e-bad'] : x.stock <= 3 ? ['Bajo', 'e-warn'] : ['Bien', 'e-ok'];
          return `<tr><td>${esc(p.nombre)}${p.agotado ? ' <span class="estado e-neu">agotado en catálogo</span>' : ''}</td><td class="n">${x.hecho}</td><td class="n">${x.vendido}</td><td class="n"><b>${x.stock}</b></td><td><span class="estado ${e[1]}">${e[0]}</span></td></tr>`; }).join('')}
        </tbody></table></div>` : '<p class="muted">Agrega jabones en Catálogo.</p>'}
        <p class="ayuda">Quedan = elaborados en Producción − vendidos en Ventas (sin contar canceladas).</p>
      </section>
      <section class="panel"><h3>Más vendidos del mes</h3>
        ${topL.length ? `<table><tbody>${topL.map(([pid, n]) => `<tr><td>${esc(prod(pid)?.nombre || 'Jabón eliminado')}</td><td style="width:40%"><div class="barrita"><i style="width:${n / maxT * 100}%"></i></div></td><td class="n">${n}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aún no hay ventas este mes.</p>'}
      </section>
    </div>
    <section class="panel"><h3>Insumos disponibles</h3>
      ${ins.length ? `<div class="tabla-wrap"><table><thead><tr><th>Insumo</th><th class="n">Comprado</th><th class="n">Usado</th><th class="n">Disponible</th><th class="n">Costo prom.</th></tr></thead><tbody>
      ${ins.map(e => `<tr><td>${esc(e.nombre)}</td><td class="n">${fmtCant(e.comprado, e.base)}</td><td class="n">${fmtCant(e.usado, e.base)}</td><td class="n"><b style="color:${e.disp < 0 ? 'var(--bad)' : 'inherit'}">${fmtCant(e.disp, e.base)}</b></td><td class="n">${e.cpu ? din(e.cpu * (e.base === 'u' ? 1 : 1000)) + (e.base === 'u' ? '/u' : '/' + (e.base === 'g' ? 'kg' : 'L')) : '—'}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">Cuando registres compras de insumos (aceites, sosa, esencias, empaques) verás aquí cuánto te queda.</p>'}
    </section>`;
  $('#mes').onchange = e => { if (e.target.value) { mesSel = e.target.value; renderSeccion(); } };
}

/* ---- Catálogo ---- */
function secCatalogo(s) {
  const st = stockProductos(), ej = D.productos.some(p => p.ejemplo);
  s.innerHTML = `<div class="sec-cab"><h2>Catálogo</h2><button class="btn pri" id="nuevo-prod">Nuevo jabón</button></div>
    ${ej ? `<div class="aviso">Los jabones marcados como <b>Ejemplo</b> son de muestra. Edítalos con tus datos o <button class="btn chico" id="quitar-ej">Quitar ejemplos</button></div>` : ''}
    <p class="muted small" style="margin:0">El catálogo es público. Al guardar, la página se actualiza en 1 o 2 minutos.</p>
    <div class="lista">${D.productos.map(p => `<div class="reg"><div class="prod-row">
        <div class="mini">${fotoHTML(p, fotoSrc(p))}</div>
        <div style="min-width:0"><h4>${esc(p.nombre)} ${p.ejemplo ? '<span class="estado e-neu">Ejemplo</span>' : ''}</h4>

function reducirFoto(file) {
  return new Promise((ok, mal) => {
    const r = new FileReader();
    r.onerror = mal;
    r.onload = () => { const img = new Image(); img.onerror = mal; img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.8)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

        nota:$('#r-nota', d).value.trim(), creado:r.creado || new Date().toISOString()};
      d.close();
      if (await guardarReg('produccion', obj, 'Producción: ' + obj.cantidad + ' × ' + obj.nombre)) toast('Producción guardada');
    };
  });
}

/* ---- Compras ---- */
function secCompras(s) {
  s.innerHTML = `<div class="sec-cab"><h2>Compras de inventario</h2><button class="btn pri" id="c-nueva">Registrar compra</button></div>
    <p class="muted small" style="margin:0">Aceites, mantecas, sosa, esencias, moldes, empaques… Lo que compres suma al inventario de insumos.</p>
    <div class="lista">${recientes(DATOS.compras).map(c => `<div class="reg">
      <div><h4>${esc(c.proveedor || 'Compra')}</h4><div class="det">${fFecha(c.fecha)}</div>
        <div class="det">${(c.items || []).map(i => `${esc(i.insumo)} ${i.cant} ${unidad(i.unidad)[0]}`).join(', ')}</div>
        ${c.nota ? `<div class="det">${esc(c.nota)}</div>` : ''}</div>
      <div class="der"><b class="num">${din(c.total)}</b></div>
      <div class="acc"><button class="btn chico plano" data-ec="${c.id}">Editar</button><button class="btn chico plano" data-bc="${c.id}">Eliminar</button></div></div>`).join('')
      || '<div class="vacio"><h3>Sin compras registradas</h3>Registra lo que compras para saber cuánto gastas y cuánto te queda de cada insumo.</div>'}</div>`;
  $('#c-nueva').onclick = () => editarCompra(null);
  $$('[data-ec]').forEach(b => b.onclick = () => editarCompra(DATOS.compras.find(x => x.id === b.dataset.ec)));
  $$('[data-bc]').forEach(b => b.onclick = () => confirmar('Eliminar compra', 'Se borrará esta compra y sus insumos dejarán de contar en el inventario.', 'Eliminar', () => borrarReg('compras', b.dataset.bc, 'Eliminar compra')));
}
function editarCompra(c) {
  const esNueva = !c;
  c = c ? structuredClone(c) : {fecha:hoy(), proveedor:'', items:[{}], nota:''};
  abrir(`<form class="dlg" id="f-c"><div class="dlg-cab"><h2>${esNueva ? 'Registrar compra' : 'Editar compra'}</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">${datalistInsumos()}
      <div class="fila"><label class="campo"><span>Fecha</span><input id="c-fecha" type="date" required value="${esc(c.fecha)}"></label>
        <label class="campo"><span>Proveedor / tienda</span><input id="c-prov" value="${esc(c.proveedor)}"></label></div>
      <div class="items-ed" id="c-items">${(c.items.length ? c.items : [{}]).map(i => filaInsumo(i, true)).join('')}</div>
      <button type="button" class="btn chico" id="c-add" style="align-self:flex-start">Agregar otro insumo</button>
      <label class="campo"><span>Nota</span><input id="c-nota" value="${esc(c.nota)}"></label>
      <div class="total-ped"><span>Total</span><span class="num" id="c-total"></span></div>
    </div>
    <div class="dlg-pie"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn pri">Guardar compra</button></div></form>`, d => {
    const cont = $('#c-items', d);
    const leer = () => $$('.item-ed', cont).map(x => ({insumo:$('.i-ins', x).value.trim(), cant:+$('.i-cant', x).value || 0, unidad:$('.i-uni', x).value, costo:+$('.i-costo', x).value || 0})).filter(i => i.insumo);
    const total = () => $('#c-total', d).textContent = din(leer().reduce((s, i) => s + i.costo, 0));
    const enlazar = () => { $$('.i-costo', cont).forEach(i => i.oninput = total);
      $$('.quitar', cont).forEach(b => b.onclick = () => { if ($$('.item-ed', cont).length > 1) b.closest('.item-ed').remove(); total(); }); };
    $('#c-add', d).onclick = () => { cont.insertAdjacentHTML('beforeend', filaInsumo({}, true)); enlazar(); };
    enlazar(); total();
    $('#f-c', d).onsubmit = async e => {
      e.preventDefault();
      const items = leer(); if (!items.length) { toast('Agrega al menos un insumo.'); return; }
      const obj = {id:esNueva ? nid('c') : c.id, fecha:$('#c-fecha', d).value, proveedor:$('#c-prov', d).value.trim(), items, total:items.reduce((s, i) => s + i.costo, 0),
        nota:$('#c-nota', d).value.trim(), creado:c.creado || new Date().toISOString()};
      d.close();
      if (await guardarReg('compras', obj, 'Compra: ' + (obj.proveedor || 'insumos'))) toast('Compra guardada');
    };
  });
}

/* ---- Ajustes ---- */
function secAjustes(s) {
  const c = D.config, link = linkTienda();
  s.innerHTML = `<div class="sec-cab"><h2>Ajustes</h2></div>
    <section class="panel" style="max-width:620px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Link del catálogo</h3>
      <div class="enlace-copia"><code>${esc(link)}</code><button class="btn chico" id="a-copiar">Copiar link</button></div>
      <p class="ayuda" style="margin:0">Compártelo por WhatsApp, Instagram o Facebook. Quien lo abra solo ve el catálogo; tus ventas y compras están en el repositorio privado.</p></section>
    <form class="panel" id="f-aj" style="display:flex;flex-direction:column;gap:14px;max-width:620px">
      <h3 style="margin:0">Datos del negocio</h3>
      <label class="campo"><span>Nombre del negocio</span><input id="a-nombre" required value="${esc(c.nombre)}"></label>
      <label class="campo"><span>Frase de presentación</span><textarea id="a-slogan">${esc(c.slogan)}</textarea></label>
      <div class="fila">
        <label class="campo"><span>WhatsApp para pedidos</span><input id="a-wa" inputmode="tel" value="${esc(c.whatsapp)}" placeholder="50370000000"><span class="ayuda">Con código de país, sin + ni espacios.</span></label>
        <label class="campo"><span>Símbolo de moneda</span><input id="a-moneda" value="${esc(c.moneda)}" maxlength="4"></label></div>
      <label class="campo"><span>Saludo del pedido</span><input id="a-intro" value="${esc(c.intro)}"><span class="ayuda">Primera línea del mensaje que recibes por WhatsApp.</span></label>
      <div><button class="btn pri">Guardar</button></div>
    </form>
    <section class="panel" style="max-width:620px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Respaldo y conexión</h3>
      <p class="ayuda" style="margin:0">GitHub guarda el historial de cada cambio. Además puedes descargar una copia de tus datos.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="a-resp">Descargar respaldo</button><button class="btn" id="a-gh">Conexión con GitHub</button></div></section>`;
  $('#a-copiar').onclick = () => copiarTexto(link, 'Link copiado');
  $('#a-gh').onclick = pantallaConexion;
  $('#a-resp').onclick = () => {
    const blob = new Blob([JSON.stringify({catalogo:D, datos:DATOS, fecha:new Date().toISOString()}, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `respaldo-jabones-${hoy()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('#f-aj').onsubmit = e => {
    e.preventDefault();
    const n = structuredClone(D);
    n.config = {nombre:$('#a-nombre').value.trim(), slogan:$('#a-slogan').value.trim(), whatsapp:$('#a-wa').value.replace(/\D/g, ''),
      moneda:$('#a-moneda').value.trim() || '$', intro:$('#a-intro').value.trim() || 'Hola, quiero hacer este pedido:'};
    guardarCatalogo(n, 'Actualizar datos del negocio');
  };
}

/* ======================= Arranque ======================= */
if (CFG) cargarTodo(); else pantallaConexion();
</script>
