<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="admin"><p class="cargando">Cargando…</p></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="comun.js"></script>
<script>
/* ======================= Conexión con GitHub ======================= */
const ESTADOS = {pendiente:['Pendiente','e-warn'], pagada:['Pagada','e-ok'], entregada:['Entregada','e-ok'], cancelada:['Cancelada','e-bad']};
const PAGOS = ['Efectivo','Transferencia','Tarjeta','Otro'];
const UNIDADES = {g:['g',1,'g'], kg:['kg',1000,'g'], ml:['ml',1,'ml'], L:['L',1000,'ml'], oz:['oz',28.35,'g'], u:['unidad',1,'u']};
const VACIO_DATOS = () => ({ventas:[], produccion:[], compras:[]});

/* Acceso con contraseña. La conexión (usuario, repositorios y clave de GitHub) se guarda cifrada en el navegador
   con una llave aleatoria; esa llave se guarda envuelta una vez por cada contraseña (administradora y dueña). */
let ACCESO = leerLocal('jab_acceso', null);   // {datos:{iv,data}, llaves:{admin:{salt,iv,data}, duena:{salt,iv,data}}}
let LLAVE = null, CFG = null, ROL = null;      // solo en memoria mientras la sesión está abierta
const ROLES = {admin:'Administradora', duena:'Dueña'};
const enc = new TextEncoder(), dec = new TextDecoder();
const aB64u8 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const deB64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const azar = n => crypto.getRandomValues(new Uint8Array(n));
async function claveDe(pass, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
const importarLlave = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function aesCifrar(key, bytes) { const iv = azar(12); return {iv:aB64u8(iv), data:aB64u8(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes)))}; }
async function aesDescifrar(key, b) { return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:deB64u8(b.iv)}, key, deB64u8(b.data))); }
async function envolverLlave(pass) { const salt = azar(16); return {salt:aB64u8(salt), ...(await aesCifrar(await claveDe(pass, salt), LLAVE))}; }
async function desenvolverLlave(pass, w) { try { return await aesDescifrar(await claveDe(pass, deB64u8(w.salt)), w); } catch { return null; } }
async function guardarAcceso() {
  ACCESO.datos = await aesCifrar(await importarLlave(LLAVE), enc.encode(JSON.stringify(CFG)));
  guardarLocal('jab_acceso', ACCESO); borrarLocal('jab_github');
}
async function entrar(pass) {
  for (const rol of ['admin', 'duena']) {
    const w = ACCESO.llaves[rol]; if (!w) continue;
    const raw = await desenvolverLlave(pass, w);
    if (raw) { LLAVE = raw; CFG = JSON.parse(dec.decode(await aesDescifrar(await importarLlave(raw), ACCESO.datos))); ROL = rol; return true; }
  }
  return false;
}
function salir() { LLAVE = CFG = ROL = null; D = catalogoVacio(); DATOS = VACIO_DATOS(); COLA = []; inicio(); }
const catalogoVacio = () => ({config:{nombre:'Jabones Artesanales', slogan:'', whatsapp:'', moneda:'$', intro:'Hola, quiero hacer este pedido:'}, productos:[]});
/* Copia de trabajo en el celular: catálogo, datos, cambios pendientes de subir (COLA) y fotos guardadas */
let D = catalogoVacio(), DATOS = VACIO_DATOS(), COLA = [], FOTOS = {}, ultimaSinc = null;
let tab = leerLocal('jab_tab', 'resumen'), mesSel = hoy().slice(0, 7);

function aB64(txt) {
  const b = new TextEncoder().encode(txt); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function deB64(b64) {
  const s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
async function gh(ruta, opts = {}, cfg = CFG) {
  const r = await fetch('https://api.github.com' + ruta, {...opts, headers:{
    Accept:'application/vnd.github+json', Authorization:'Bearer ' + cfg.token, 'X-GitHub-Api-Version':'2022-11-28', ...(opts.headers || {})}});
  if (!r.ok) {
    const e = new Error('GitHub ' + r.status); e.status = r.status;
    try { e.detalle = (await r.json()).message; } catch {}
    throw e;
  }
  return r.status === 204 ? null : r.json();
}
const rutaArchivo = (repo, ruta, cfg = CFG) => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(repo)}/contents/${ruta.split('/').map(encodeURIComponent).join('/')}`;
async function leerArchivo(repo, ruta) {
  try {
    const r = await gh(rutaArchivo(repo, ruta) + '?ref=' + encodeURIComponent(CFG.rama));
    let txt;
    if (r.encoding === 'base64') txt = deB64(r.content || '');
    else { // archivos de más de 1 MB llegan sin contenido: se piden en crudo
      const raw = await fetch('https://api.github.com' + rutaArchivo(repo, ruta) + '?ref=' + encodeURIComponent(CFG.rama),
        {headers:{Accept:'application/vnd.github.raw+json', Authorization:'Bearer ' + CFG.token}});
      txt = await raw.text();
    }
    return {txt, sha:r.sha};
  } catch (e) { if (e.status === 404) return {txt:null, sha:null}; throw e; }
}
async function escribirArchivo(repo, ruta, contenidoB64, sha, mensaje) {
  const r = await gh(rutaArchivo(repo, ruta), {method:'PUT', body:JSON.stringify({message:mensaje, content:contenidoB64, branch:CFG.rama, ...(sha ? {sha} : {})})});
  return r.content.sha;
}
async function borrarArchivo(repo, ruta, mensaje) {
  try {
    const r = await gh(rutaArchivo(repo, ruta) + '?ref=' + encodeURIComponent(CFG.rama));
    await gh(rutaArchivo(repo, ruta), {method:'DELETE', body:JSON.stringify({message:mensaje, sha:r.sha, branch:CFG.rama})});
  } catch {}
}
function errorGitHub(e) {
  if (!navigator.onLine) return 'No hay conexión a internet.';
  if (ROL !== 'admin' && [401, 403, 404].includes(e.status)) return `No se pudo conectar con el almacenamiento (código ${e.status}). Avisa a tu administradora.`;
  if (e.status === 401) return 'La clave de GitHub no es válida o ya venció. Crea una nueva en Ajustes.';
  if (e.status === 403) return 'La clave no tiene permiso para escribir en el repositorio (o GitHub limitó las solicitudes). Revisa los permisos de la clave.';
  if (e.status === 404) return 'No se encontró el repositorio. Revisa el usuario y los nombres en Ajustes, y que la clave tenga acceso a ambos.';
  if (e.status === 409) return 'Los datos cambiaron desde otro dispositivo. Toca Actualizar y repite el cambio.';
  return 'No se pudo guardar: el almacenamiento respondió con un error' + (e.detalle ? ': ' + e.detalle : '.') ;
}
/* El catálogo vive en la misma dirección que este panel (sea github.io o el dominio propio) */
const linkTienda = () => location.origin + location.pathname.replace(/admin(\.html)?$/, '');
/* Foto: la recién tomada (aún sin subir), la guardada en el celular o la publicada */
function fotoSrc(p) {
  if (p.fotoNueva) return p.fotoNueva;
  if (!p.foto) return '';
  return FOTOS[p.foto] || p.foto;
}

/* ======================= Memoria del celular (IndexedDB) ======================= */
const idb = (() => {
  let abierta;
  const abrir = () => abierta ||= new Promise((ok, mal) => {
    const r = indexedDB.open('jabones', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
  const op = async (modo, fn) => {
    const db = await abrir();
    return new Promise((ok, mal) => { const t = db.transaction('kv', modo), req = fn(t.objectStore('kv')); t.oncomplete = () => ok(req.result); t.onerror = () => mal(t.error); });
  };
  return {get:k => op('readonly', s => s.get(k)), set:(k, v) => op('readwrite', s => s.put(v, k)), del:k => op('readwrite', s => s.delete(k))};
})();
const persistir = () => idb.set('estado', {catalogo:D, datos:DATOS, cola:COLA, fotos:FOTOS, ultimaSinc}).catch(() => toast('No se pudo guardar en la memoria del celular.'));
async function cargarLocal() {
  try { const e = await idb.get('estado'); if (!e) return false;
    D = e.catalogo; DATOS = {...VACIO_DATOS(), ...e.datos}; COLA = e.cola || []; FOTOS = e.fotos || {}; ultimaSinc = e.ultimaSinc || null; MONEDA = D.config.moneda || '$'; return true;
  } catch { return false; }
}

/* ======================= Cambios: se aplican al momento y se suben después ======================= */
function aplicarOp(cat, dat, op) {
  if (op.t === 'prod') { const i = cat.productos.findIndex(x => x.id === op.p.id); if (i >= 0) cat.productos[i] = structuredClone(op.p); else cat.productos.push(structuredClone(op.p)); }
  else if (op.t === 'prodBorrar') cat.productos = cat.productos.filter(x => x.id !== op.id);
  else if (op.t === 'config') cat.config = {...op.config};
  else if (op.t === 'reg') { const l = dat[op.col]; const i = l.findIndex(x => x.id === op.obj.id); if (i >= 0) l[i] = op.obj; else l.push(op.obj); }
  else if (op.t === 'regBorrar') dat[op.col] = dat[op.col].filter(x => x.id !== op.id);
}
const esCatalogo = op => op.t === 'prod' || op.t === 'prodBorrar' || op.t === 'config';
async function cambiar(op, aviso) {
  aplicarOp(D, DATOS, op); COLA.push(op); MONEDA = D.config.moneda || '$';
  await persistir();
  if (aviso) toast(aviso + (navigator.onLine ? '' : ' en el celular. Se subirá cuando haya internet.'));
  esCatalogo(op) ? renderAdmin() : renderSeccion();
  programarSinc();
  return true;
}
const guardarReg = (col, obj, msg) => cambiar({t:'reg', col, obj, msg});
const borrarReg = (col, id, msg) => cambiar({t:'regBorrar', col, id, msg}, 'Registro eliminado');

/* ======================= Sincronización con la nube ======================= */
let sincronizando = false, otraVez = false, errorSinc = '', temporizador = null;
function programarSinc(ms = 2500) { clearTimeout(temporizador); temporizador = setTimeout(() => sincronizar(), ms); }
function pintarEstadoSinc() {
  const el = $('#sinc'); if (!el) return;
  const n = COLA.length, hora = ultimaSinc ? new Date(ultimaSinc).toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'}) : '';
  el.className = 'sinc' + ((!navigator.onLine || errorSinc) && n ? ' sinc-alerta' : '');
  el.textContent = sincronizando ? 'Sincronizando…'
    : !navigator.onLine ? (n ? `Sin internet · ${n} ${n === 1 ? 'cambio guardado' : 'cambios guardados'} en el celular` : 'Sin internet')
    : errorSinc ? `No se pudo sincronizar${n ? ` · ${n} pendiente${n === 1 ? '' : 's'}` : ''}`
    : n ? `${n} ${n === 1 ? 'cambio' : 'cambios'} por subir`
    : hora ? 'Sincronizado ' + hora : '';
  el.title = errorSinc;
}
function mensajeCommit(ops) {
  if (!ops.length) return 'Crear archivo de datos';
  return ops.length === 1 && ops[0].msg ? ops[0].msg : `${ops.length} cambios desde la app`;
}
async function sincronizar(manual) {
  if (!CFG) return;
  if (sincronizando) { otraVez = true; return; }
  if (!navigator.onLine) { pintarEstadoSinc(); if (manual) toast('Sin internet. Tus cambios están guardados en el celular.'); return; }
  sincronizando = true; pintarEstadoSinc();
  try {
    // 1. Fotos nuevas: se suben primero y el cambio pendiente queda apuntando al archivo
    for (const op of COLA) if (op.t === 'prod' && op.p.fotoNueva) {
      const ruta = `fotos/${op.p.id}-${Date.now().toString(36)}.jpg`;
      await escribirArchivo(CFG.pub, ruta, op.p.fotoNueva.split(',')[1], null, 'Foto de ' + op.p.nombre);
      FOTOS[ruta] = op.p.fotoNueva; op.p.foto = ruta; delete op.p.fotoNueva;
      for (const p of D.productos) if (p.id === op.p.id && p.fotoNueva) { p.foto = ruta; delete p.fotoNueva; }
      await persistir();
    }
    // 2. Se baja lo que hay en la nube, se le aplican los cambios del celular y se sube (reintenta si otro dispositivo guardó a la vez)
    for (let intento = 0; intento < 3; intento++) {
      const [rc, rd] = await Promise.all([leerArchivo(CFG.pub, 'catalogo.json'), leerArchivo(CFG.priv, 'datos.json')]);
      const catNube = rc.txt ? JSON.parse(rc.txt) : catalogoVacio();
      const datNube = rd.txt ? {...VACIO_DATOS(), ...JSON.parse(rd.txt)} : VACIO_DATOS();
      const n = COLA.length, ops = COLA.slice(0, n);
      const cat = structuredClone(catNube), dat = structuredClone(datNube);
      ops.forEach(op => aplicarOp(cat, dat, op));
      const opsCat = ops.filter(esCatalogo), opsDat = ops.filter(o => !esCatalogo(o));
      try {
        // solo se sube un archivo si su contenido realmente cambió
        const txtCat = JSON.stringify(cat, null, 2) + '\n', txtDat = JSON.stringify(dat) + '\n';
        if (txtCat !== rc.txt && (opsCat.length || !rc.txt)) await escribirArchivo(CFG.pub, 'catalogo.json', aB64(txtCat), rc.sha, mensajeCommit(opsCat));
        if (txtDat !== rd.txt && (opsDat.length || !rd.txt)) await escribirArchivo(CFG.priv, 'datos.json', aB64(txtDat), rd.sha, mensajeCommit(opsDat));
      } catch (e) { if (e.status === 409 || e.status === 422) continue; throw e; }
      // Fotos que ya no usa ningún jabón: se borran de la nube
      if (opsCat.length) {
        const sobran = new Set(catNube.productos.map(p => p.foto).filter(f => f && f.startsWith('fotos/')));
        cat.productos.forEach(p => sobran.delete(p.foto));
        sobran.forEach(f => { delete FOTOS[f]; borrarArchivo(CFG.pub, f, 'Borrar foto sin usar'); });
      }
      COLA = COLA.slice(n);
      D = cat; DATOS = dat; COLA.forEach(op => aplicarOp(D, DATOS, op));
      MONEDA = D.config.moneda || '$';
      ultimaSinc = new Date().toISOString(); errorSinc = '';
      await persistir();
      if (!$('#dlg').open) renderAdmin(); else pendienteRender = true;
      if (manual) toast('Todo sincronizado');
      return;
    }
    throw Object.assign(new Error('conflicto'), {status:409});
  } catch (e) {
    errorSinc = errorGitHub(e);
    if (manual || [401, 403, 404].includes(e.status)) toast(errorSinc);
  } finally {
    sincronizando = false; pintarEstadoSinc();
    if (otraVez) { otraVez = false; programarSinc(500); }
  }
}
let pendienteRender = false;
document.addEventListener('DOMContentLoaded', () => $('#dlg').addEventListener('close', () => { if (pendienteRender) { pendienteRender = false; renderAdmin(); } }));
window.addEventListener('online', () => { pintarEstadoSinc(); sincronizar(); });
window.addEventListener('offline', pintarEstadoSinc);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CFG) sincronizar(); });

/* Al entrar: se abre lo guardado en el celular y se sincroniza en segundo plano */
async function cargarTodo() {
  $('#admin').innerHTML = '<p class="cargando">Abriendo…</p>';
  if (await cargarLocal()) { renderAdmin(); sincronizar(); return; }
  if (!navigator.onLine) {
    $('#admin').innerHTML = `<div class="wrap"><div class="vacio" style="margin-top:40px"><h3>Se necesita internet la primera vez</h3><p>Conéctate una vez para descargar tus datos. Después la app funciona sin internet.</p>
      <button class="btn pri" id="reint">Reintentar</button></div></div>`;
    $('#reint').onclick = cargarTodo; return;
  }
  $('#admin').innerHTML = '<p class="cargando">Descargando tus datos…</p>';
  await sincronizar();
  if (errorSinc) {
    $('#admin').innerHTML = `<div class="wrap"><div class="vacio" style="margin-top:40px"><h3>No se pudieron descargar los datos</h3><p>${esc(errorSinc)}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" id="reint">Reintentar</button>${ROL === 'admin' ? '<button class="btn" id="a-cfg">Revisar la conexión</button>' : ''}<button class="btn" id="a-salir">Salir</button></div></div></div>`;
    $('#reint').onclick = cargarTodo;
    $('#a-salir').onclick = salir;
    const a = $('#a-cfg'); if (a) a.onclick = () => pantallaConexion();
  }
}
/* ======================= Entrada y configuración ======================= */
function inicio() {
  if (ACCESO && ACCESO.llaves) return pantallaEntrar();
  pantallaSinConfigurar();
}
async function nombreNegocio() {
  try { const r = await fetch('catalogo.json?v=' + Date.now(), {cache:'no-store'}); const c = await r.json(); MONEDA = c.config.moneda || '$'; return c.config.nombre || ''; } catch { return ''; }
}
function marcoAcceso(titulo, cuerpo) {
  return `<main class="wrap seccion" style="max-width:440px;padding-top:12vh">
    <div class="marca-logo"><img class="logo" src="logo.png" alt="" width="440" height="337"><h1 class="oculto" id="m-nombre">Panel</h1></div>
    <section class="panel" style="display:flex;flex-direction:column;gap:14px"><h3 style="margin:0">${titulo}</h3>${cuerpo}</section></main>`;
}
async function pintarNombre() { const n = await nombreNegocio(); if (n && $('#m-nombre')) { $('#m-nombre').textContent = n; document.title = 'Panel · ' + n; } }
function pantallaEntrar(aviso = '') {
  setTimeout(() => { const m = $('#e-msg'); if (m && aviso) m.textContent = aviso; }, 0);
  $('#admin').innerHTML = marcoAcceso('Entrar al panel', `
    <form id="f-ent" style="display:flex;flex-direction:column;gap:14px">
      <label class="campo"><span>Contraseña</span><input id="e-pass" type="password" required autocomplete="current-password" autofocus></label>
      <button class="btn pri">Entrar</button>
      <p class="ayuda" id="e-msg" aria-live="polite" style="margin:0"></p>
    </form>
    <p class="ayuda" style="margin:0">¿Olvidaste la contraseña? Pídele a tu administradora que la cambie.</p>`);
  pintarNombre();
  $('#f-ent').onsubmit = async e => {
    e.preventDefault();
    const msg = $('#e-msg'), b = $('#f-ent button'); msg.textContent = 'Revisando…'; b.disabled = true;
    if (await entrar($('#e-pass').value)) { cargarTodo(); return; }
    b.disabled = false; msg.textContent = 'Contraseña incorrecta.'; $('#e-pass').select();
  };
}
function pantallaSinConfigurar() {
  $('#admin').innerHTML = marcoAcceso('Este dispositivo todavía no está configurado', `
    <p style="margin:0">Pídele a tu administradora el <b>link de acceso</b> y ábrelo en este celular. Después solo necesitarás tu contraseña para entrar.</p>
    <button class="btn" id="s-conf" style="align-self:flex-start">Soy la administradora: configurar</button>`);
  pintarNombre();
  $('#s-conf').onclick = () => pantallaConexion();
}
/* Solo la administradora: conexión con GitHub y contraseñas */
function pantallaConexion() {
  const previo = leerLocal('jab_github', null);   // versión anterior del panel, sin contraseña
  const editando = ROL === 'admin';
  const c = CFG || previo || {owner:'', pub:'jabones', priv:'jabones-datos', rama:'main', token:''};
  const opcional = editando ? ' (déjala vacía para no cambiarla)' : '';
  $('#admin').innerHTML = `<main class="wrap seccion" style="max-width:680px">
    <div class="sec-cab"><h2>Conexión y contraseñas</h2><button class="btn" id="c-volver">${editando ? 'Volver' : 'Cancelar'}</button></div>
    <p class="muted" style="margin:0">Solo la administradora ve esta pantalla. Los datos de GitHub se guardan cifrados en este navegador; la dueña entra solo con su contraseña y nunca los ve.</p>
    ${previo && !editando ? '<div class="aviso">Ahora el panel usa contraseñas. Crea la tuya y la de la dueña para seguir.</div>' : ''}
    <form class="panel" id="f-con" style="display:flex;flex-direction:column;gap:14px">
      <h3 style="margin:0">Conexión con GitHub</h3>
      <label class="campo"><span>Usuario u organización de GitHub</span><input id="c-owner" required autocomplete="off" value="${esc(c.owner)}" placeholder="mi-usuario"></label>
      <div class="fila">
        <label class="campo"><span>Repositorio público (la página)</span><input id="c-pub" required value="${esc(c.pub)}"></label>
        <label class="campo"><span>Repositorio privado (los datos)</span><input id="c-priv" required value="${esc(c.priv)}"></label>
        <label class="campo"><span>Rama</span><input id="c-rama" required value="${esc(c.rama)}"></label></div>
      <label class="campo"><span>Clave de acceso (token)</span><input id="c-token" type="password" required autocomplete="off" value="${esc(c.token)}" placeholder="github_pat_…">
        <span class="ayuda">Un token "fine-grained" con acceso solo a esos dos repositorios y permiso <b>Contents: Read and write</b>.</span></label>
      <h3 style="margin:6px 0 0">Contraseñas del panel</h3>
      <div class="fila">
        <label class="campo"><span>Contraseña de administradora${opcional}</span><input id="c-pa" type="password" autocomplete="new-password" ${editando ? '' : 'required'}></label>
        <label class="campo"><span>Repítela</span><input id="c-pa2" type="password" autocomplete="new-password"></label></div>
      <div class="fila">
        <label class="campo"><span>Contraseña de la dueña${opcional}</span><input id="c-pd" type="password" autocomplete="new-password" ${editando ? '' : 'required'}></label>
        <label class="campo"><span>Repítela</span><input id="c-pd2" type="password" autocomplete="new-password"></label></div>

/* ======================= Cálculos ======================= */
const prod = id => D.productos.find(p => p.id === id);
function stockProductos() {
  const m = {};
  D.productos.forEach(p => m[p.id] = {hecho:0, vendido:0});
  DATOS.produccion.forEach(r => { (m[r.pid] ||= {hecho:0, vendido:0}).hecho += +r.cantidad || 0; });
  DATOS.ventas.filter(v => v.estado !== 'cancelada').forEach(v => (v.items || []).forEach(i => { (m[i.pid] ||= {hecho:0, vendido:0}).vendido += +i.cant || 0; }));
  Object.values(m).forEach(x => x.stock = x.hecho - x.vendido);
  return m;
}
const unidad = u => UNIDADES[u] || UNIDADES.u;
const claveInsumo = (n, u) => (n || '').trim().toLowerCase() + '|' + unidad(u)[2];
function insumos() {
  const m = {};
  const ent = (n, u) => m[claveInsumo(n, u)] ||= {nombre:(n || '').trim(), base:unidad(u)[2], comprado:0, usado:0, costo:0};
  DATOS.compras.forEach(c => (c.items || []).forEach(i => { if (!i.insumo) return; const e = ent(i.insumo, i.unidad); e.comprado += (+i.cant || 0) * unidad(i.unidad)[1]; e.costo += +i.costo || 0; }));
  DATOS.produccion.forEach(r => (r.insumos || []).forEach(i => { if (!i.insumo) return; ent(i.insumo, i.unidad).usado += (+i.cant || 0) * unidad(i.unidad)[1]; }));
  Object.values(m).forEach(e => { e.disp = e.comprado - e.usado; e.cpu = e.comprado ? e.costo / e.comprado : 0; });
  return Object.values(m).sort((a, b) => a.nombre.localeCompare(b.nombre));
}
const fmtCant = (n, base) => (Math.round(n * 100) / 100).toLocaleString('es') + ' ' + base;

function reducirFoto(file) {
  return new Promise((ok, mal) => {
    const r = new FileReader();
    r.onerror = mal;
    r.onload = () => { const img = new Image(); img.onerror = mal; img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', 0.8)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function pegarPedido() {
  abrir(`<form class="dlg" id="f-pega"><div class="dlg-cab"><h2>Pegar pedido</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo"><label class="campo"><span>Mensaje recibido por WhatsApp</span><textarea id="pega-txt" rows="9" placeholder="• 2 × Avena y miel — $9.00&#10;Total: $9.00&#10;Nombre: Ana"></textarea></label>
    <p class="ayuda">Se reconocen los jabones del catálogo, el nombre y la nota. Revisa los datos antes de guardar.</p></div>
    <div class="dlg-pie"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn pri">Continuar</button></div></form>`, d => {
    $('#f-pega', d).onsubmit = e => {
      e.preventDefault();
      const t = $('#pega-txt', d).value, items = [];
      t.split('\n').forEach(l => {
        const m = l.match(/^\s*[•\-*]?\s*(\d+)\s*[×xX]\s*(.+?)\s*(?:—|-|\(|$)/);
        if (!m) return;
        const nom = m[2].trim().toLowerCase();
        const p = D.productos.find(p => p.nombre.toLowerCase() === nom) || D.productos.find(p => nom.includes(p.nombre.toLowerCase()) || p.nombre.toLowerCase().includes(nom));
        if (p) items.push({pid:p.id, nombre:p.nombre, cant:+m[1], precio:p.precio});
      });
      const cliente = (t.match(/Nombre:\s*(.+)/i) || [])[1] || '', nota = (t.match(/Nota:\s*(.+)/i) || [])[1] || '';
      if (!items.length) { toast('No encontré jabones del catálogo en ese mensaje.'); return; }
      editarVenta({items, cliente:cliente.trim(), nota:nota.trim(), estado:'pendiente', fecha:hoy()}, true);
    };
  });
}
function filaItemVenta(i = {}) {

}
function editarVenta(v, desdePegado) {
  const esNueva = !v || desdePegado;

  abrir(`<form class="dlg" id="f-venta"><div class="dlg-cab"><h2>${esNueva ? 'Nueva venta' : 'Editar venta'}</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">

        <label class="campo"><span>Teléfono</span><input id="v-tel" inputmode="tel" value="${esc(v.telefono)}"></label></div>
      <div class="items-ed" id="v-items">${(v.items.length ? v.items : [{}]).map(filaItemVenta).join('')}</div>
      <button type="button" class="btn chico" id="v-add" style="align-self:flex-start">Agregar otro jabón</button>
      <div class="fila"><label class="campo"><span>Estado</span><select id="v-estado">${Object.entries(ESTADOS).map(([k, x]) => `<option value="${k}" ${k === v.estado ? 'selected' : ''}>${x[0]}</option>`).join('')}</select></label>
        <label class="campo"><span>Forma de pago</span><select id="v-pago"><option value="">—</option>${PAGOS.map(p => `<option ${p === v.pago ? 'selected' : ''}>${p}</option>`).join('')}</select></label></div>
      <label class="campo"><span>Nota</span><input id="v-nota" value="${esc(v.nota)}"></label>

    </div>
    <div class="dlg-pie"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn pri">Guardar venta</button></div></form>`, d => {
    const cont = $('#v-items', d);
    const leer = () => $$('.item-ed', cont).map(r => ({pid:$('.i-pid', r).value, cant:+$('.i-cant', r).value || 0, precio:+$('.i-precio', r).value || 0})).filter(i => i.pid && i.cant > 0);

    const enlazar = () => $$('.item-ed', cont).forEach(r => {

    enlazar(); total();
    $('#f-venta', d).onsubmit = async e => {
      e.preventDefault();
      const items = leer().map(i => ({...i, nombre:prod(i.pid)?.nombre || ''}));
      if (!items.length) { toast('Agrega al menos un jabón.'); return; }
      const obj = {id:esNueva ? nid('v') : v.id, fecha:$('#v-fecha', d).value, cliente:$('#v-cliente', d).value.trim(), telefono:$('#v-tel', d).value.trim(),

    <div class="lista">${recientes(DATOS.produccion).map(r => { const c = costoLote(r); return `<div class="reg">
      <div><h4>${esc(prod(r.pid)?.nombre || r.nombre || 'Jabón eliminado')}</h4>

    await compartirArchivos([archivo], 'Respaldo de ' + (D.config.nombre || 'Jabones'));
  };
  $('#f-aj').onsubmit = e => {
    e.preventDefault();
    const config = {nombre:$('#a-nombre').value.trim(), slogan:$('#a-slogan').value.trim(), whatsapp:$('#a-wa').value.replace(/\D/g, ''),
      moneda:$('#a-moneda').value.trim() || '$', intro:$('#a-intro').value.trim() || 'Hola, quiero hacer este pedido:'};
    cambiar({t:'config', config, msg:'Actualizar datos del negocio'}, 'Guardado');
  };
}

/* ======================= Compartir el catálogo por WhatsApp ======================= */
async function compartirArchivos(archivos, texto) {
  if (navigator.canShare && navigator.canShare({files:archivos})) {
    try { await navigator.share({files:archivos, text:texto}); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  for (const f of archivos) {   // sin la opción de compartir: se descargan para enviarlas desde la galería
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  toast(archivos.length > 1 ? 'Archivos descargados. Envíalos desde tu galería o tus descargas.' : 'Archivo descargado. Envíalo desde tus descargas.');
}
async function compartirTexto(texto) {
  if (navigator.share) { try { await navigator.share({text:texto}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank', 'noopener');
}
const disponibles = () => D.productos.filter(p => p.visible !== false && !p.agotado && !p.ejemplo);
function textoCatalogo(lista) {
  const c = D.config;
  const lineas = lista.map(p => [`*${p.nombre}* — ${din(p.precio)}${p.peso ? ` (${p.peso} g)` : ''}`,
    (p.pieles || []).length ? `Para piel: ${p.pieles.map(k => PIELES[k]).join(', ')}` : '', p.descripcion].filter(Boolean).join('\n'));
  return [`*${c.nombre}*`, c.slogan, '', ...lineas.flatMap(l => [l, '']),
    'Haz tu pedido respondiendo a este mensaje.'].filter((l, i, a) => l || a[i - 1]).join('\n').trim();
}
function opcionesCompartir(p) {
  const lista = p ? [p] : disponibles();
  // Por qué algunos jabones no se envían: son de ejemplo, están ocultos o agotados
  const fuera = p ? [] : D.productos.filter(x => !lista.includes(x));
  const nEj = fuera.filter(x => x.ejemplo).length, nOtros = fuera.length - nEj;
  const aviso = [nEj ? `${nEj} de ejemplo` : '', nOtros ? `${nOtros} oculto${nOtros === 1 ? '' : 's'} o agotado${nOtros === 1 ? '' : 's'}` : ''].filter(Boolean).join(' y ');
  const n = lista.length;
  abrir(`<div class="dlg"><div class="dlg-cab"><h2>${p ? 'Compartir ' + esc(p.nombre) : 'Compartir catálogo'}</h2><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <p style="margin:0">${p ? 'Envía este jabón a tus clientas.' : n ? `Se ${n === 1 ? 'envía 1 jabón' : `envían ${n} jabones`}.` : 'Todavía no hay jabones propios para enviar.'}</p>
      ${aviso ? `<div class="aviso">No se ${fuera.length === 1 ? 'incluye' : 'incluyen'} ${aviso}.${nEj ? ' Edita los de ejemplo con tus datos (dejan de ser ejemplo al guardarlos) o quítalos.' : ''}</div>` : ''}
      ${n ? `<button class="btn pri" id="cp-img">${n === 1 ? 'Como imagen' : `Como imágenes (${n}, una por jabón)`}</button>
      <button class="btn" id="cp-txt">Como mensaje de texto</button>` : ''}
      ${p ? '' : `<button class="btn" id="cp-link">Enviar el link del catálogo</button>
      <p class="ayuda" style="margin:0">Con el link, tus clientas ven el catálogo completo en internet y te envían su pedido por WhatsApp.</p>`}
      <p class="ayuda" style="margin:0">Se abre el menú de compartir de tu celular: elige WhatsApp y el chat o estado.</p>
    </div></div>`, d => {
    const bl = $('#cp-link', d);
    if (bl) bl.onclick = () => { d.close(); const c = D.config;
      compartirTexto([`*${c.nombre}*`, c.slogan, '', 'Mira nuestro catálogo y haz tu pedido aquí:', linkTienda()].filter((l, i, a) => l || a[i - 1]).join('\n')); };
    if (!n) return;
    $('#cp-txt', d).onclick = () => { d.close(); compartirTexto(textoCatalogo(lista)); };
    $('#cp-img', d).onclick = async e => {
      const b = e.currentTarget; b.disabled = true; b.textContent = 'Preparando imágenes…';
      try {
        const archivos = [];
        for (const x of lista) archivos.push(new File([await imagenJabon(x)], `${x.nombre.replace(/[^\w]+/g, '-').toLowerCase() || 'jabon'}.jpg`, {type:'image/jpeg'}));
        d.close();
        await compartirArchivos(archivos, p ? textoCatalogo([p]) : `*${D.config.nombre}* · Catálogo de jabones`);
      } catch { b.disabled = false; b.textContent = 'Reintentar'; toast('No se pudieron preparar las imágenes.'); }
    };
  });
}
/* Tarjeta de 1080 × 1350 (formato vertical de WhatsApp e Instagram) */
async function imagenJabon(p) {
  await document.fonts.ready;
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#f1f3ee'; x.fillRect(0, 0, W, H);
  // Foto o pastilla de color
  const FH = 760, src = fotoSrc(p);
  let img = null;
  if (src) img = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  if (img) {
    const k = Math.max(W / img.width, FH / img.height), w = img.width * k, h = img.height * k;
    x.drawImage(img, (W - w) / 2, (FH - h) / 2, w, h);
  } else {
    x.fillStyle = '#e7ebe2'; x.fillRect(0, 0, W, FH);
    x.fillStyle = p.color || '#c9b48f'; redondeado(x, 260, 180, 560, 400, 70); x.fill();
    x.fillStyle = 'rgba(255,255,255,.85)'; x.font = '160px "Young Serif", Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText((p.nombre || '?').trim()[0] || '?', W / 2, 385);
  }
  // Textos
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  let y = FH + 90;
  x.fillStyle = '#1d2520'; x.font = '64px "Young Serif", Georgia, serif';
  y = escribir(x, p.nombre, 70, y, W - 140, 72, 2) + 20;
  const pieles = (p.pieles || []).map(k => PIELES[k]);
  if (pieles.length) {
    x.font = '600 30px Figtree, sans-serif'; let px = 70;
    for (const t of pieles) {
      const w = x.measureText(t).width + 40;
      if (px + w > W - 70) break;
      x.fillStyle = '#efdcd8'; redondeado(x, px, y - 34, w, 50, 25); x.fill();
      x.fillStyle = '#7c3f39'; x.fillText(t, px + 20, y + 2); px += w + 12;
    }
    y += 66;
  }
  x.fillStyle = '#626d61'; x.font = '34px Figtree, sans-serif';
  y = escribir(x, p.descripcion || '', 70, y, W - 140, 46, 3);
  // Precio y pie
  x.fillStyle = '#3d6a4b'; x.font = '700 76px Figtree, sans-serif';
  x.fillText(din(p.precio), 70, H - 110);
  if (p.peso) { const w = x.measureText(din(p.precio)).width; x.fillStyle = '#626d61'; x.font = '500 34px Figtree, sans-serif'; x.fillText(`${p.peso} g`, 90 + w, H - 110); }
  x.fillStyle = '#3d6a4b'; x.fillRect(0, H - 64, W, 64);
  x.fillStyle = '#ffffff'; x.font = '600 30px Figtree, sans-serif';
  x.fillText(D.config.nombre || '', 70, H - 22);
  if (D.config.whatsapp) { x.textAlign = 'right'; x.fillText('WhatsApp +' + D.config.whatsapp, W - 70, H - 22); }
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', .9));
}
function redondeado(x, l, t, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(l, t, w, h, r) : x.rect(l, t, w, h); }
function escribir(x, texto, l, y, ancho, alto, maxLineas) {
  const palabras = String(texto).split(/\s+/).filter(Boolean); let linea = '', n = 0;
  for (let i = 0; i < palabras.length; i++) {
    const prueba = linea ? linea + ' ' + palabras[i] : palabras[i];
    if (x.measureText(prueba).width > ancho && linea) {
      if (++n === maxLineas) { x.fillText(linea.replace(/[,.;:]?$/, '…'), l, y); return y + alto; }
      x.fillText(linea, l, y); y += alto; linea = palabras[i];
    } else linea = prueba;
  }
  if (linea) { x.fillText(linea, l, y); y += alto; }
  return y;
}

/* ======================= Link de acceso para la dueña ======================= */
/* El link lleva la conexión cifrada y solo la llave de la dueña: sin su contraseña no sirve, y no da acceso de administradora */
const aB64url = s => btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const deB64url = s => atob(s.replace(/-/g, '+').replace(/_/g, '/'));
function mostrarLinkAcceso() {
  if (!ACCESO.llaves.duena) { toast('Primero crea la contraseña de la dueña en Conexión y contraseñas.'); return; }
  const link = location.origin + location.pathname + '#acceso=' + aB64url(JSON.stringify({datos:ACCESO.datos, llaves:{duena:ACCESO.llaves.duena}}));
  abrir(`<div class="dlg"><div class="dlg-cab"><h2>Link de acceso</h2><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <ol class="pasos">
        <li>Envíale este link a la dueña.</li>
        <li>Dile su contraseña <b>por otro medio</b> (una llamada o en persona), no en el mismo chat.</li>
        <li>Ella abre el link en <b>Chrome</b>, escribe su contraseña y luego instala la app desde Ajustes.</li>
      </ol>
      <textarea class="inp" rows="4" readonly id="lk-txt">${esc(link)}</textarea>
      <p class="ayuda" style="margin:0">El link no muestra tus datos de GitHub y no sirve sin la contraseña. Si cambias la clave de GitHub o su contraseña, envíale un link nuevo.</p>
    </div>
    <div class="dlg-pie"><button class="btn" id="lk-copiar">Copiar link</button><button class="btn pri" id="lk-enviar">Enviar</button></div></div>`, d => {
    $('#lk-copiar', d).onclick = () => copiarTexto(link, 'Link copiado');
    $('#lk-enviar', d).onclick = () => compartirTexto(`Acceso a la app de ${D.config.nombre || 'tu negocio'}. Ábrelo en Chrome:\n${link}`);
  });
}
/* Al abrir la app con un link de acceso: se guarda en este dispositivo y se pide la contraseña */
function recibirAcceso() {
  const m = location.hash.match(/^#acceso=([\w-]+)$/); if (!m) return false;
  history.replaceState(null, '', location.pathname);
  let nuevo;
  try { nuevo = JSON.parse(deB64url(m[1])); if (!nuevo.datos || !nuevo.llaves || !nuevo.llaves.duena) throw 0; }
  catch { inicio(); toast('El link de acceso no es válido. Pide uno nuevo.'); return true; }
  const guardar = () => { ACCESO = {datos:nuevo.datos, llaves:{duena:nuevo.llaves.duena}}; guardarLocal('jab_acceso', ACCESO); borrarLocal('jab_github');
    pantallaEntrar('Acceso recibido. Escribe tu contraseña para entrar.'); };
  if (ACCESO && ACCESO.llaves) { inicio(); confirmar('Reemplazar el acceso de este dispositivo', 'Este dispositivo ya está configurado. Si continúas, se usará el acceso del link, que entra con la contraseña de la dueña.', 'Reemplazar', guardar); }
  else guardar();
  return true;
}

/* ======================= Arranque ======================= */
if (!recibirAcceso()) inicio();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
